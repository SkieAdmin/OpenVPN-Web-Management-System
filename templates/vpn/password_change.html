{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="head"><div><h1>Change password</h1><p class="sub">Logged in as {{ user.username }}.</p></div></div>
<form method="post" class="card" style="max-width:480px">{% csrf_token %}
  {% include "_fields.html" with fields=form %}
  <button class="primary" type="submit">Change password</button>
</form>
{% endblock %}
